---
layout: default
---

<div class="paper">
  <a class="back-link" href="{{ '/blog/' | relative_url }}">← Blog</a>

  <article>
    <header class="article-header">
      <h1 class="article-title">{{ page.title }}</h1>
      <p class="article-meta">{{ page.date | date: "%B %-d, %Y" }}</p>
    </header>

    <div class="prose">
      {{ content }}
    </div>
  </article>
</div>
