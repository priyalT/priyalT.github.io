---
layout: blog_page
---

<div class="paper">
  <nav class="back-link">
    <a href="{{ '/blog/' | relative_url }}">← Back to all posts</a>
  </nav>

  <article>
    <header style="margin-bottom: 32px;">
      <time style="color: #64748b; font-size: 14px;">{{ page.date | date: "%B %d, %Y" }}</time>
      <h1 class="paper-heading">{{ page.title }}</h1>
      {% if page.description %}
        <p class="paper-intro">{{ page.description }}</p>
      {% endif %}

    </header>

    <div class="prose">
      {{ content }}
    </div>
  </article>
</div>
