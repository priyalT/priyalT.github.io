---
layout: default
---

<article class="project">

  <p class="eyebrow">PROJECT</p>

  <h1>{{ page.title }}</h1>

  <p class="project-description">
    {{ page.description }}
  </p>

  <div class="tags">
    {% for tag in page.tags %}
      <span>{{ tag }}</span>
    {% endfor %}
  </div>

  <div class="project-content">
    {{ content }}
  </div>

  {% if page.github %}
    <a href="{{ page.github }}">
      View on GitHub ↗
    </a>
  {% endif %}

</article>
