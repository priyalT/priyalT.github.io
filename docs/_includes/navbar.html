<header class="surface py-4 inset-x-0 top-0 p-4 fixed z-[1000]" id="site-header">
  <nav class="flex justify-between items-center w-[90%] mx-auto">

    <div class="flex items-center gap-4 sm:gap-6 xl:gap-20 min-w-0">
      <a href="{{ '/' | relative_url }}" class="w-12 sm:w-16 shrink-0">
        <img src="{{ '/assets/images/logo.png' | relative_url }}" alt="Logo">
      </a>
      <a href="{{ '/' | relative_url }}" class="w-24 sm:w-28 flex items-center shrink-0">
        <img src="{{ '/assets/images/title.png' | relative_url }}" alt="Title">
      </a>
    </div>

    <button type="button" class="retro-yellow-box nav-toggle lg:hidden" id="nav-toggle"
            aria-label="Toggle navigation" aria-expanded="false" aria-controls="nav-links">&#9776;</button>

    <div class="nav-links hidden lg:flex lg:static absolute lg:min-h-fit
                left-0 top-full lg:w-auto w-full items-center px-5 py-6 lg:py-0" id="nav-links">
      <ul class="flex lg:flex-row flex-col lg:items-center lg:gap-4 xl:gap-[3vw] min-[1400px]:gap-[5vw] gap-6 items-center w-full lg:w-auto">

        <li>
          <a href="{{ '/' | relative_url }}" class="typewriter-box">
            <span class="prompt">&gt;</span>
            <span id="typewriter-text"></span><span class="typewriter-cursor">_</span>
          </a>
        </li>

        <li> <a class="retro-yellow-box" href="{{ '/' | relative_url }}"> Home </a> </li>
        <li> <a class="retro-yellow-box" href="{{ '/blog/' | relative_url }}"> Blog </a> </li>
        <li> <a class="retro-yellow-box" href="{{ '/research/' | relative_url }}"> Research </a> </li>
        <li> <a class="retro-yellow-box" href="https://drive.google.com/file/d/14ZViGZw54LSQhn7V4355_lZlt7oPhui6/view?usp=sharing" target="_blank" rel="noopener noreferrer"> CV ↗ </a> </li>
      </ul>
    </div>
  </nav>
</header>

<script>
  (function () {
    const toggle = document.getElementById("nav-toggle");
    const links = document.getElementById("nav-links");
    if (toggle && links) {
      toggle.addEventListener("click", function () {
        const open = links.classList.toggle("hidden") === false;
        links.classList.toggle("flex", open);
        toggle.setAttribute("aria-expanded", String(open));
      });
    }
  })();

  (function () {
    const phrases = [
      "Hi, I'm Priyal!",
      "Welcome to my lab.",
      "Our experiments will include",
      "Spatial Omics",
      "RNA-seq",
      "Research Software",
      "Open Source",
      "Have fun!"
    ];

    let phraseIdx = 0;
    let charIdx = 0;
    let isDeleting = false;
    const typingSpeed = 80;
    const deletingSpeed = 45;
    const pauseBeforeDelete = 1600;

    function loopTypewriter() {
      const currentPhrase = phrases[phraseIdx];
      const target = document.getElementById("typewriter-text");
      if (!target) return;

      if (isDeleting) {
        target.textContent = currentPhrase.substring(0, charIdx - 1);
        charIdx--;
      } else {
        target.textContent = currentPhrase.substring(0, charIdx + 1);
        charIdx++;
      }

      let delay = isDeleting ? deletingSpeed : typingSpeed;

      if (!isDeleting && charIdx === currentPhrase.length) {
        delay = pauseBeforeDelete;
        isDeleting = true;
      } else if (isDeleting && charIdx === 0) {
        isDeleting = false;
        phraseIdx = (phraseIdx + 1) % phrases.length;
        delay = 400;
      }

      setTimeout(loopTypewriter, delay);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", loopTypewriter);
    } else {
      loopTypewriter();
    }
  })();
</script>
